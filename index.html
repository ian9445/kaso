    function bindViewEvents() {
      $$('[data-view]', $("#viewRoot")).forEach((el) => el.addEventListener("click", (event) => { event.preventDefault(); renderView(el.dataset.view); }));
      $$('[data-ask-product]', $("#viewRoot")).forEach((el) => el.addEventListener("click", () => askProduct(el.dataset.askProduct)));
      $$('[data-budget-detail]', $("#viewRoot")).forEach((el) => el.addEventListener("click", () => updateBudgetDetail(el.dataset.budgetDetail)));
      $$('[data-category]').forEach((el) => el.addEventListener("click", () => { state.searchCategory = el.dataset.category; renderView("search"); }));
      const searchForm = $("#searchForm");
      if (searchForm) searchForm.addEventListener("submit", (event) => { event.preventDefault(); const q = $("#searchInput").value.trim(); if (!q) { openAssistant("我想比價"); return; } state.searchQuery = q; renderView("search"); });
      $$('[data-evaluate]', $("#viewRoot")).forEach((el) => el.addEventListener("click", async () => {
        const id = el.dataset.evaluate;
        const result = await api("/api/products/evaluate", { method: "POST", body: JSON.stringify({ price: Number(el.dataset.price) }) });
        state.evaluations[id] = result;
        renderView("search");
      }));
      const ledgerForm = $("#ledgerForm");
      if (ledgerForm) ledgerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const amount = Number($("#ledgerAmount").value);
        if (!amount) return;
        await api("/api/ledger", { method: "POST", body: JSON.stringify({ amount, category: $("#ledgerCategory").value, note: $("#ledgerNote").value.trim() }) });
        await loadLedger();
        await refreshBudget();
        renderView("ledger");
        showToast("已新增記帳並更新可花餘額");
      });
      $$('[data-priority]').forEach((el) => el.addEventListener("click", () => { state.travelPriority = el.dataset.priority; renderView("travel"); }));
      $$('[data-insurance]').forEach((el) => el.addEventListener("click", () => { state.insuranceTab = el.dataset.insurance; renderView("insurance"); }));
      const claimCheck = $("#claimCheck");
      if (claimCheck) claimCheck.addEventListener("click", () => { if (!$("#claimText").value.trim()) { showToast("請先描述發生的狀況"); return; } $("#claimResult").hidden = false; });
      const calculateForeign = $("#calculateForeign");
      if (calculateForeign) calculateForeign.addEventListener("click", calculateForeignCost);
      const settleDaily = $("#settleDaily");
      if (settleDaily) settleDaily.addEventListener("click", settleDailyBudget);
      const delayGoal = $("#delayGoal");
      if (delayGoal) delayGoal.addEventListener("click", async () => {
        const p = state.profile;
        if (p.goal) p.goal.months += 1;
        const { profile, budget } = await api("/api/profile", { method: "POST", body: JSON.stringify(p) });
        state.profile = profile;
        state.budget = budget;
        renderView("home");
        showToast("已將完成期限延後 1 個月");
      });
    }

    function updateBudgetDetail(id) {
      state.budgetDetail = id;
      const f = getFinance();
      const detail = budgetDetailData(f, id);
      $$('[data-budget-detail]').forEach((button) => button.classList.toggle("active", button.dataset.budgetDetail === id));
      const panel = $("#spendDetail");
      const content = $("#spendDetailContent");
      if (!panel || !content) return;
      panel.style.setProperty("--detail-glow", detail.glow);
      content.innerHTML = budgetDetailMarkup(f, id);
      content.classList.remove("is-changing");
      requestAnimationFrame(() => content.classList.add("is-changing"));
    }

    async function settleDailyBudget() {
      const tray = $("#settlementTray");
      const button = $("#settleDaily");
      const source = $("#dailyPocket");
      const target = $("#balanceDonut");
      if (!tray || !button || !source || !target || state.settlementDone) return;
      button.disabled = true;
      const result = await api("/api/budget/settle", { method: "POST" });
      tray.classList.add("is-moving");
      target.classList.add("is-receiving");
      const sourceRect = source.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const flyingCard = document.createElement("div");
      flyingCard.className = "settlement-fly-card";
      flyingCard.innerHTML = `<small>今日未用預算</small><strong>${money(result.unused)}</strong>`;
      Object.assign(flyingCard.style, { left: sourceRect.left + "px", top: sourceRect.top + "px", width: sourceRect.width + "px", height: sourceRect.height + "px" });
      document.body.appendChild(flyingCard);
      const dx = targetRect.left + targetRect.width / 2 - (sourceRect.left + sourceRect.width / 2);
      const dy = targetRect.top + targetRect.height / 2 - (sourceRect.top + sourceRect.height / 2);
      if (typeof flyingCard.animate === "function") {
        flyingCard.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: `translate(${dx * .22}px,${Math.min(-110, dy * .45)}px) scale(.96)`, opacity: 1, offset: .45 },
          { transform: `translate(${dx}px,${dy}px) scale(.16)`, opacity: .12 }
        ], { duration: 1180, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
      }
      window.setTimeout(() => {
        flyingCard.remove();
        state.settlementDone = true;
        renderView("home");
        showToast("今日未用預算已移回目前餘額");
      }, 1220);
    }

    function calculateForeignCost() {
      const twd = Number($("#currency").value) * Number($("#foreignAmount").value || 0);
      const fee = twd * .015;
      const final = twd + fee - twd * .033;
      $("#foreignTwd").textContent = money(twd);
      $("#foreignFee").textContent = money(fee);
      $("#foreignFinal").textContent = money(final);
    }

    function showMega(key) {
      const menu = $("#megaMenu");
      menu.innerHTML = `<div class="shell mega-grid">${megaContent[key].map((col, i) => `<div class="mega-col${i === 0 ? " primary" : ""}"><small>${col[0]}</small>${col[1].map((label) => `<button type="button" data-mega-action="${escapeAttr(label)}">${label}</button>`).join("")}${i === 2 ? `<p>功能保留完整，首頁只顯示最需要的入口。</p>` : ""}</div>`).join("")}</div>`;
      menu.hidden = false;
      $$('[data-mega-action]', menu).forEach((btn) => btn.addEventListener("click", () => handleMegaAction(btn.dataset.megaAction)));
    }

    function handleMegaAction(label) {
      if (/機票|飯店|旅遊預算/.test(label)) return renderView("travel");
      if (/保險|保障|理賠|保單/.test(label)) return renderView("insurance");
      if (/訂閱|音樂|影音/.test(label)) return renderView("subscriptions");
      if (/海外/.test(label)) return renderView("overseas");
      if (/記帳|支出|目標/.test(label)) return renderView("ledger");
      if (/附近|文化幣|免費活動|公尺|店家/.test(label)) return renderView("nearby");
      renderView("search");
    }

    function hideMega() { $("#megaMenu").hidden = true; }

    function askProduct(detail) {
      openAssistant();
      const parts = detail.split("｜");
      sendToAssistant(`請幫我看這個商品：${parts[0]}${parts[1] ? `（${parts[1]}）` : ""}${parts[2] ? `，價格 ${parts[2]}` : ""}`);
    }

    function openAssistant(prefill) {
      $("#assistantPanel").hidden = false;
      $("#assistantFab").hidden = true;
      renderMessages();
      if (prefill) { $("#assistantInput").value = prefill; $("#assistantInput").focus(); }
    }

    function addMessage(role, text) {
      state.messages.push({ role, text });
      renderMessages();
    }

    function renderMessages() {
      const log = $("#chatLog");
      log.innerHTML = state.messages.map((m) => `<div class="bubble ${m.role}${m.pending ? " pending" : ""}">${escapeHtml(m.text)}</div>`).join("");
      log.scrollTop = log.scrollHeight;
    }

    // KASO AI 真的接 Claude API（backend/src/services/assistant.js），key 只在後端，前端不會碰到。
    async function sendToAssistant(text) {
      addMessage("user", text);
      state.messages.push({ role: "ai", text: "思考中…", pending: true });
      renderMessages();
      try {
        const { reply } = await api("/api/assistant/chat", { method: "POST", body: JSON.stringify({ message: text, history: state.messages.slice(0, -1) }) });
        state.messages[state.messages.length - 1] = { role: "ai", text: reply };
      } catch (err) {
        state.messages[state.messages.length - 1] = { role: "ai", text: "KASO AI 暫時連不上：後端可能還沒設定 ANTHROPIC_API_KEY（見 backend/.env.example）。" };
      }
      renderMessages();
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#096;"); }

    $$("#onboarding input").forEach((input) => input.addEventListener("input", updateOnboardingPreview));
    $("#completeSetup").addEventListener("click", saveProfileAndEnter);
    $("#resetProfile").addEventListener("click", resetProfile);
    $$("[data-view]", $("#siteHeader")).forEach((el) => el.addEventListener("click", () => renderView(el.dataset.view)));
    $$("[data-mega]").forEach((el) => { el.addEventListener("mouseenter", () => showMega(el.dataset.mega)); el.addEventListener("focus", () => showMega(el.dataset.mega)); });
    $("#siteHeader").addEventListener("mouseleave", hideMega);
    $("#locateHeader").addEventListener("click", () => { state.nearbyStores = null; renderView("nearby"); });
    $("#assistantFab").addEventListener("click", () => openAssistant());
    $("#assistantClose").addEventListener("click", () => { $("#assistantPanel").hidden = true; $("#assistantFab").hidden = false; });
    $("#assistantForm").addEventListener("submit", (event) => { event.preventDefault(); const input = $("#assistantInput"); const text = input.value.trim(); if (!text) return; input.value = ""; sendToAssistant(text); });
    $("#feedbackOpen").addEventListener("click", () => $("#feedbackDialog").showModal());
    $("#feedbackSend").addEventListener("click", (event) => { if (!$("#feedbackText").value.trim()) { event.preventDefault(); showToast("請先填寫回報內容"); return; } localStorage.setItem("kaso-html-feedback", JSON.stringify({ type: $("#feedbackType").value, text: $("#feedbackText").value, view: state.view, at: new Date().toISOString() })); showToast("回報已保存在此 HTML 裝置中"); });

    async function boot() {
      await loadQuiz();
      try {
        const profile = await api("/api/profile");
        if (profile) {
          state.profile = profile;
          state.resolvedType = profile.type;
          state.budget = await api("/api/budget");
          $("#onboarding").hidden = true;
          $("#mainApp").hidden = false;
          await loadLedger();
          renderView("home");
          return;
        }
      } catch (_) { /* 後端還沒有 profile，走 onboarding */ }
      renderGoalFields();
      updateOnboardingPreview();
    }
    boot();
    renderMessages();
  </script>
</body>
</html>
