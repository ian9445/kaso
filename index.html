<!doctype html>
<!--
  KASO HTML review baseline, created from the public v17 experience.
  Workflow: apply and review future interface changes in this file before updating the production Site.
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="卡搜 KASO 月光族目標存錢、商品比價與生活決策 HTML 互動稿">
  <title>卡搜 KASO｜HTML 互動稿</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #667085;
      --line: #e6e9ef;
      --soft: #f5f7fa;
      --panel: #ffffff;
      --violet: #6d4aff;
      --violet-soft: #f0edff;
      --blue: #0878df;
      --blue-deep: #0560b4;
      --lime: #b8ff3d;
      --lime-deep: #78b800;
      --danger: #d92d20;
      --warning: #f79009;
      --green: #087a55;
      --shadow: 0 18px 55px rgba(17, 24, 39, .08);
      --radius: 24px;
      --radius-xl: 36px;
      --radius-lg: 28px;
      --radius-md: 18px;
      --apple-ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    svg { width: 1.1rem; height: 1.1rem; stroke-width: 2; flex: 0 0 auto; }
    .shell { width: min(1180px, calc(100% - 36px)); margin-inline: auto; }
    .eyebrow {
      display: flex; align-items: center; gap: 7px; margin: 0 0 9px;
      color: var(--violet); font-size: .78rem; font-weight: 850; letter-spacing: .04em;
    }
    .muted { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    .brand { display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; cursor: pointer; }
    .brand-mark {
      width: 39px; height: 39px; border-radius: 12px; display: grid; place-items: center;
      background: var(--ink); color: #fff;
    }
    .brand-copy { display: grid; text-align: left; line-height: 1.08; }
    .brand-copy strong { font-size: .98rem; letter-spacing: -.02em; }
    .brand-copy small { color: var(--muted); font-size: .7rem; margin-top: 4px; }

    .primary-btn, .secondary-btn, .text-btn, .icon-btn {
      border: 0; border-radius: 999px; cursor: pointer; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .primary-btn { min-height: 46px; padding: 0 19px; background: var(--ink); color: #fff; }
    .primary-btn:hover { transform: translateY(-1px); background: #000; }
    .primary-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .secondary-btn { min-height: 43px; padding: 0 17px; background: #fff; border: 1px solid var(--line); }
    .secondary-btn:hover { border-color: #b9c0cb; }
    .text-btn { padding: 8px 3px; background: transparent; color: var(--violet); }
    .icon-btn { width: 42px; height: 42px; background: #fff; border: 1px solid var(--line); }

    /* Onboarding */
    .onboarding {
      min-height: 100vh; padding: 28px 0 60px;
      background:
        radial-gradient(circle at 7% 1%, rgba(184,255,61,.24), transparent 28%),
        radial-gradient(circle at 98% 4%, rgba(109,74,255,.14), transparent 24%),
        #f6f7fb;
    }
    .onboarding-card {
      width: min(1100px, calc(100% - 32px)); margin: auto; padding: 28px;
      border: 1px solid rgba(255,255,255,.85); border-radius: 32px; background: rgba(255,255,255,.93);
      box-shadow: var(--shadow); backdrop-filter: blur(18px);
    }
    .onboarding-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .onboarding-heading { max-width: 680px; margin: 64px 0 28px; }
    .onboarding-heading h1 { margin: 0; font-size: clamp(2.1rem, 5vw, 4.25rem); line-height: .98; letter-spacing: -.065em; }
    .onboarding-heading > p:last-child { margin: 18px 0 0; color: var(--muted); font-size: 1.05rem; }
    .mode-grid { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 14px; }
    #quizOptions.mode-grid { grid-template-columns: 1fr 1fr; }
    .mode-card {
      min-height: 155px; padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: #fff;
      text-align: left; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 13px;
    }
    .mode-card:hover, .mode-card.selected { border-color: var(--violet); box-shadow: 0 12px 30px rgba(109,74,255,.1); }
    .mode-card.featured { background: linear-gradient(145deg, #fbfff3, #fff); }
    .mode-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: var(--soft); }
    .mode-card.selected .mode-icon { background: var(--violet); color: #fff; }
    .mode-card span:nth-child(2) { display: grid; gap: 4px; }
    .mode-card b { font-size: 1.1rem; }
    .mode-card small { color: var(--muted); font-size: .8rem; }
    .mode-card .mode-check { color: var(--violet); }

    .setup-card { margin-top: 18px; padding: 22px; border: 1px solid var(--line); border-radius: 24px; background: #fbfcfe; }
    .setup-heading { display: flex; gap: 13px; align-items: center; }
    .setup-heading > span { width: 42px; height: 42px; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet); border-radius: 14px; }
    .setup-heading h2 { margin: 0; font-size: 1.35rem; }
    .setup-heading p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; }
    .finance-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 18px; }
    .field { display: grid; gap: 7px; color: #344054; font-size: .78rem; font-weight: 750; }
    .field input, .field select, .field textarea {
      width: 100%; min-height: 44px; border: 1px solid #d9dee7; border-radius: 12px; background: #fff; padding: 10px 12px; color: var(--ink); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(109,74,255,.11); }
    .finance-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 16px; overflow: hidden; background: var(--line); border: 1px solid var(--line); border-radius: 16px; }
    .finance-preview > span { padding: 14px; display: grid; gap: 2px; background: #fff; }
    .finance-preview small { color: var(--muted); font-size: .72rem; }
    .finance-preview strong { font-size: 1.08rem; }
    .quality-card { margin-top: 18px; padding: 22px; border-radius: 24px; background: var(--ink); color: #fff; }
    .quality-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .quality-head h2 { margin: 0; font-size: 1.3rem; }
    .quality-head p { margin: 5px 0 0; color: #aeb7c6; font-size: .83rem; }
    .quality-total { padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.09); font-size: .75rem; white-space: nowrap; }
    .quality-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-top: 18px; }
    .quality-item { padding: 14px; border: 1px solid #344054; border-radius: 16px; background: #182230; }
    .quality-item label { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; font-weight: 800; }
    .quality-item small { display: block; min-height: 38px; color: #98a2b3; font-size: .72rem; margin-top: 4px; }
    .quality-item input { width: 100%; accent-color: var(--lime); margin-top: 9px; }
    .quality-item output { color: var(--lime); }
    .onboarding-note { margin: 16px 0 0; color: var(--muted); font-size: .76rem; }

    /* Main shell */
    .site-header {
      position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.88); border-bottom: 1px solid rgba(220,224,232,.85);
      backdrop-filter: blur(18px);
    }
    .header-row { min-height: 68px; display: grid; grid-template-columns: 230px 1fr auto; align-items: center; gap: 18px; }
    .main-nav { display: flex; justify-content: center; gap: 3px; }
    .nav-btn { min-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 999px; cursor: pointer; font-size: .86rem; font-weight: 750; }
    .nav-btn:hover, .nav-btn.active { background: var(--soft); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .persona-chip { min-height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; font-size: .77rem; font-weight: 800; }
    .finance-mini { display: flex; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: #fff; }
    .finance-mini span { display: grid; padding: 6px 10px; line-height: 1.05; }
    .finance-mini span + span { border-left: 1px solid var(--line); }
    .finance-mini small { color: var(--muted); font-size: .6rem; }
    .finance-mini strong { font-size: .76rem; margin-top: 4px; }
    .finance-mini .safe strong { color: var(--blue); }
    .location-btn { width: 38px; height: 38px; border: 0; border-radius: 999px; display: grid; place-items: center; color: #fff; background: var(--blue); cursor: pointer; }

    .mega-menu { position: absolute; inset: 68px 0 auto; background: rgba(255,255,255,.98); border-bottom: 1px solid var(--line); box-shadow: 0 22px 45px rgba(17,24,39,.12); }
    .mega-grid { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 46px; padding-block: 30px 34px; }
    .mega-col { display: grid; align-content: start; gap: 8px; }
    .mega-col small { color: #98a2b3; font-size: .7rem; margin-bottom: 4px; }
    .mega-col button { width: fit-content; border: 0; background: transparent; padding: 2px 0; text-align: left; cursor: pointer; font-weight: 720; }
    .mega-col.primary button { font-size: 1.28rem; letter-spacing: -.025em; }
    .mega-col p { margin: 4px 0 0; color: var(--muted); font-size: .76rem; max-width: 260px; }

    .main-content { padding: 26px 0 90px; }
    .view { animation: view-in .22s ease; }
    @keyframes view-in { from { opacity: .2; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .page-title { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 20px; }
    .page-title h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.5rem); line-height: 1.02; letter-spacing: -.055em; }
    .page-title p { max-width: 650px; margin: 10px 0 0; color: var(--muted); }
    .demo-pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 11px; color: var(--muted); font-size: .72rem; white-space: nowrap; }

    :is(.onboarding-card, .setup-card, .quality-card, .money-overview, .service-panel, .service-card, .toolbar, .feature-card, .result-panel, .product-card, .merchant-card, .assistant-panel, dialog) {
      corner-shape: squircle;
    }

    :is(.service-card, .product-card, .merchant-card, .feature-card, .result-panel, .toolbar) {
      transition: transform .28s var(--apple-ease), box-shadow .28s var(--apple-ease), border-color .28s var(--apple-ease);
    }

    :is(.service-card, .product-card, .merchant-card):hover {
      transform: translateY(-3px);
      border-color: #d0d5dd;
      box-shadow: 0 18px 40px rgba(17, 24, 39, .08);
    }

    /* Dashboard */
    .money-overview {
      border-radius: var(--radius-xl); background: #fff; border: 1px solid rgba(222,226,234,.9); box-shadow: 0 24px 70px rgba(17,24,39,.07);
    }
    .money-copy h1 { margin: 9px 0 0; font-size: clamp(2.2rem, 4.8vw, 4.1rem); line-height: 1; letter-spacing: -.065em; }
    .money-copy h2 { margin: 12px 0 0; font-size: 1.22rem; }
    .money-copy > p:last-of-type { color: var(--muted); margin: 7px 0 17px; max-width: 470px; font-size: .88rem; }
    .status-pill { display: inline-flex; padding: 6px 9px; border-radius: 999px; background: #ecfdf3; color: var(--green); font-size: .72rem; font-weight: 850; }
    .money-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .money-actions button { min-height: 40px; border: 0; border-radius: 999px; padding: 0 14px; background: var(--soft); font-weight: 800; cursor: pointer; }
    .donut-area { display: grid; place-items: center; align-content: center; gap: 13px; }
    .donut { width: 184px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .donut::after { content: ""; position: absolute; width: 61%; aspect-ratio: 1; border-radius: 50%; background: #fff; }
    .donut span { z-index: 1; display: grid; text-align: center; line-height: 1.1; }
    .donut small { color: var(--muted); font-size: .67rem; }
    .donut strong { font-size: 1.23rem; margin-top: 5px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; font-size: .67rem; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; }
    .goal-card { display: grid; gap: 1px; overflow: hidden; border-radius: 20px; background: var(--line); }
    .goal-card > span { display: grid; gap: 3px; padding: 13px 15px; background: #fbfcfd; }
    .goal-card small { color: var(--muted); font-size: .69rem; }
    .goal-card strong { font-size: .93rem; }
    .goal-card button { min-height: 44px; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-weight: 800; }

    .dashboard-stage { padding: 0; overflow: hidden; }
    .balance-stage-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 24px 26px 18px; }
    .balance-stage-head h1 { margin: 2px 0 0; font-size: clamp(1.45rem, 3vw, 2.25rem); letter-spacing: -.045em; }
    .balance-stage-head .money-actions { justify-content: flex-end; }
    .balance-stage-grid { display: grid; grid-template-columns: 190px minmax(0, 1fr) 280px; gap: 16px; padding: 0 20px 20px; min-height: 360px; }

    .spend-rail { padding: 14px; border-radius: var(--radius-lg); background: #f5f5f7; display: flex; flex-direction: column; gap: 9px; }
    .spend-rail > small { margin: 2px 4px 5px; color: var(--muted); font-size: .72rem; font-weight: 800; }
    .spend-pill {
      width: 100%; min-height: 53px; padding: 8px 10px; border: 1px solid #d5eaff; border-radius: 17px; background: #eef7ff; color: #075fae;
      display: grid; grid-template-columns: 29px 1fr; gap: 9px; align-items: center; text-align: left; cursor: pointer;
      transition: transform .25s var(--apple-ease), background .25s ease, color .25s ease, box-shadow .25s ease;
    }
    .spend-pill:hover { transform: scale(1.025); background: #e2f2ff; }
    .spend-pill.active { background: #0878df; border-color: #0878df; color: #fff; box-shadow: 0 12px 24px rgba(8,120,223,.24); }
    .spend-pill .plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; font-size: 1rem; line-height: 1; }
    .spend-pill span:last-child { display: grid; gap: 1px; }
    .spend-pill strong { font-size: .8rem; }
    .spend-pill small { opacity: .76; font-size: .65rem; }

    .spend-detail {
      position: relative; overflow: hidden; min-height: 100%; padding: 28px; border-radius: var(--radius-lg);
      background: linear-gradient(145deg, #0f1728, #182437); color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .spend-detail::after { content: ""; position: absolute; width: 260px; height: 260px; right: -105px; top: -105px; border-radius: 50%; background: var(--detail-glow, rgba(109,74,255,.34)); filter: blur(2px); }
    .spend-detail-content { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100%; }
    .spend-detail-content.is-changing { animation: detail-pop .36s var(--apple-ease); }
    @keyframes detail-pop { 0% { opacity: .25; transform: scale(.965) translateY(7px); } 100% { opacity: 1; transform: none; } }
    .detail-kicker { display: flex; align-items: center; gap: 7px; color: #c9d2df; font-size: .72rem; font-weight: 800; }
    .detail-amount { margin-top: 13px; font-size: clamp(2.5rem, 5vw, 4.55rem); line-height: .95; letter-spacing: -.065em; font-weight: 900; }
    .detail-title { margin: 12px 0 0; font-size: 1.05rem; }
    .detail-copy { max-width: 520px; margin: 6px 0 20px; color: #b9c3d2; font-size: .78rem; }
    .detail-lines { margin-top: auto; display: grid; gap: 9px; }
    .detail-line { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; }
    .detail-line span, .detail-line strong { font-size: .7rem; }
    .detail-line i { height: 6px; border-radius: 999px; background: rgba(255,255,255,.13); overflow: hidden; }
    .detail-line i::after { content: ""; display: block; width: var(--line-width); height: 100%; border-radius: inherit; background: var(--line-color, #7cbcff); }

    .donut-side { padding: 22px 18px; border-radius: var(--radius-lg); background: #f5f5f7; display: grid; place-items: center; align-content: center; gap: 13px; text-align: center; }
    .donut-side > small { color: var(--muted); font-size: .72rem; font-weight: 800; }
    .donut.large { width: min(220px, 100%); }
    .donut.large::after { width: 64%; background: #f5f5f7; }
    .donut.large small { font-size: .72rem; }
    .donut.large strong { font-size: 1.35rem; }
    .donut-side .legend { max-width: 220px; }
    .donut-side .legend i { position: static; flex: 0 0 auto; }
    .donut-side .legend-fixed { background: #111827; }
    .donut-side .legend-saving { background: #6d4aff; }
    .donut-side .legend-spent { background: #0878df; }
    .donut-side .legend-available { background: #b8ff3d; }
    .donut-side .status-pill { margin-top: 2px; }

    .settlement-tray {
      position: relative; display: grid; grid-template-columns: minmax(180px,.68fr) 1fr 1fr; gap: 14px; align-items: stretch;
      margin: 0 20px 20px; padding: 14px; border-radius: var(--radius-lg); background: #f5f5f7; overflow: hidden;
    }
    .settlement-guide { padding: 8px 7px; display: flex; flex-direction: column; justify-content: center; }
    .settlement-guide small { color: var(--blue); font-size: .68rem; font-weight: 900; }
    .settlement-guide strong { margin-top: 4px; font-size: .82rem; }
    .settlement-guide span { margin-top: 4px; color: var(--muted); font-size: .66rem; }
    .settlement-pocket { position: relative; z-index: 1; min-height: 84px; padding: 15px 17px; border-radius: 21px; background: #fff; display: flex; justify-content: space-between; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(17,24,39,.045); }
    .settlement-pocket > span { display: grid; gap: 3px; }
    .settlement-pocket small { color: var(--muted); font-size: .68rem; }
    .settlement-pocket strong { font-size: 1.05rem; }
    .settlement-pocket button { min-height: 37px; border: 0; border-radius: 999px; padding: 0 12px; background: var(--ink); color: #fff; cursor: pointer; font-size: .7rem; font-weight: 850; }
    .settlement-pocket button:disabled { opacity: .48; cursor: default; }
    .daily-pocket { border: 1px solid #b2ddff; background: linear-gradient(145deg,#fff,#f3f9ff); }
    .settlement-tray.is-moving .daily-pocket { opacity: .28; transform: scale(.98); transition: 220ms ease; }
    .settlement-fly-card { position: fixed; z-index: 120; display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 2px solid #0878df; border-radius: 21px; background: #fff; padding: 15px 17px; color: var(--ink); box-shadow: 0 28px 65px rgba(8,120,223,.3); pointer-events: none; }
    .settlement-fly-card small, .settlement-fly-card strong { display: block; }
    .settlement-fly-card small { color: var(--muted); font-size: .68rem; }
    .settlement-fly-card strong { font-size: 1.05rem; }
    .donut-side.is-receiving .donut { animation: balance-absorb 1.22s var(--apple-ease); }
    @keyframes balance-absorb { 0%,62% { transform: scale(1); filter: none; } 78% { transform: scale(1.09); filter: drop-shadow(0 0 18px rgba(8,120,223,.36)); } 100% { transform: scale(1); filter: none; } }

    .zero-balance-card { margin: 0 20px 20px; padding: 17px 18px; border-radius: 23px; background: #fff4f1; border: 1px solid #ffd5cc; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .zero-balance-card p { margin: 0; display: grid; gap: 3px; }
    .zero-balance-card strong { color: #912018; }
    .zero-balance-card small { color: #a04438; font-size: .72rem; }

    .qa-section { margin-top: 22px; padding: 30px 30px 10px; border-radius: var(--radius-xl); background: #fff; border: 1px solid rgba(222,226,234,.9); }
    .qa-title { margin-bottom: 24px; }
    .qa-title h2 { margin: 0; font-size: clamp(2rem, 4.5vw, 3.8rem); letter-spacing: -.06em; line-height: 1; }
    .qa-list { border-top: 1px solid var(--line); }
    .qa-list details { border-bottom: 1px solid var(--line); }
    .qa-list summary { list-style: none; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 18px; cursor: pointer; font-weight: 800; }
    .qa-list summary::-webkit-details-marker { display: none; }
    .qa-list summary::after { content: "+"; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #667085; background: #f5f5f7; font-size: 1.18rem; font-weight: 500; transition: transform .28s var(--apple-ease), background .28s ease; }
    .qa-list details[open] summary::after { transform: rotate(45deg); background: #eaf4ff; color: var(--blue); }
    .qa-answer { max-width: 820px; padding: 0 54px 22px 0; color: var(--muted); font-size: .82rem; animation: qa-open .28s var(--apple-ease); }
    @keyframes qa-open { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
    .qa-answer p { margin: 0; }
    .qa-answer a { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; color: var(--blue); font-weight: 800; }
    .qa-answer a::after { content: "›"; font-size: 1.05rem; }

    .service-panel { margin-top: 22px; padding: 26px; border: 1px solid rgba(222,226,234,.9); border-radius: var(--radius-xl); background: #fff; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; }
    .section-head h2 { margin: 0; font-size: 1.4rem; letter-spacing: -.025em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: .8rem; }
    .section-head > span { color: var(--muted); font-size: .74rem; }
    .service-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .service-card { min-height: 226px; padding: 19px; border: 1px solid var(--line); border-radius: 25px; background: #fff; display: flex; flex-direction: column; }
    .service-card.primary { background: linear-gradient(145deg, #f8fff0, #fff 55%); border-color: #d9f5aa; }
    .service-title { display: flex; min-height: 48px; align-items: center; gap: 11px; }
    .service-title > span { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); }
    .service-title small { color: var(--muted); font-size: .68rem; }
    .service-title h3 { margin: 2px 0 0; font-size: 1.12rem; }
    .service-title p { margin: 5px 0 0; color: var(--muted); font-size: .76rem; }
    .service-main { width: 100%; min-height: 44px; margin-top: 20px; border: 0; border-radius: 15px; background: var(--ink); color: #fff; cursor: pointer; font-weight: 800; }
    .service-children { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .service-children button { min-height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 10px; cursor: pointer; font-size: .7rem; font-weight: 750; }
    .metric { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .7rem; }

    /* Shared pages */
    .toolbar, .feature-card, .result-panel, .notice-card { border: 1px solid var(--line); background: #fff; border-radius: var(--radius-lg); }
    .toolbar { padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .toolbar input, .toolbar select { min-height: 44px; border: 1px solid #d8dde6; border-radius: 12px; padding: 0 12px; background: #fff; }
    .toolbar input { flex: 1 1 300px; }
    .toolbar .primary-btn { min-height: 44px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .chip { min-height: 36px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 12px; cursor: pointer; font-size: .75rem; font-weight: 750; }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .product-card { display: grid; grid-template-rows: 146px auto; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; }
    .product-image { display: grid; place-items: center; background: linear-gradient(145deg, #f1f3f7, #fff); color: #98a2b3; }
    .product-image svg { width: 52px; height: 52px; }
    .product-body { padding: 16px; }
    .product-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .platform { padding: 5px 8px; border-radius: 999px; background: #fff2ed; color: #c4320a; font-size: .65rem; font-weight: 850; }
    .match { color: var(--green); font-size: .68rem; font-weight: 800; }
    .product-card h3 { min-height: 47px; margin: 12px 0 6px; font-size: .94rem; line-height: 1.45; }
    .product-price { font-size: 1.45rem; font-weight: 900; letter-spacing: -.03em; }
    .after-buy { margin: 7px 0 0; color: var(--muted); font-size: .72rem; }
    .after-buy.insufficient { color: #b42318; font-weight: 750; }
    .product-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .product-actions button, .product-actions a { flex: 1 1 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: .72rem; font-weight: 800; }
    .product-actions button { border: 1px solid var(--line); background: #fff; cursor: pointer; }
    .product-actions a { background: var(--ink); color: #fff; }
    .price-list { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--line); }
    .price-list li { display: flex; justify-content: space-between; padding: 6px 0; font-size: .74rem; color: var(--muted); border-bottom: 1px dashed var(--line); }
    .price-list li:last-child { border-bottom: 0; }
    .price-list strong { color: var(--ink); }

    .summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 16px 0; border: 1px solid var(--line); background: var(--line); border-radius: 18px; overflow: hidden; }
    .summary-strip > div { padding: 14px; background: #fff; }
    .summary-strip small { display: block; color: var(--muted); font-size: .68rem; }
    .summary-strip strong { display: block; margin-top: 4px; font-size: 1.05rem; }

    .merchant-list { display: grid; gap: 12px; }
    .merchant-card { display: grid; grid-template-columns: 48px 1fr 220px; gap: 15px; align-items: center; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; }
    .merchant-icon { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet); }
    .merchant-card h3 { margin: 5px 0 3px; font-size: 1rem; }
    .merchant-card p { margin: 2px 0; color: var(--muted); font-size: .74rem; }
    .merchant-result { text-align: right; }
    .merchant-result strong { display: block; font-size: 1.2rem; }
    .merchant-result small { color: var(--muted); font-size: .7rem; }
    .directions { min-height: 42px; margin-top: 9px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--blue); color: #fff; font-size: .78rem; font-weight: 850; }
    .directions:hover { background: var(--blue-deep); }

    .two-col { display: grid; grid-template-columns: .82fr 1.18fr; gap: 18px; align-items: start; }
    .feature-card, .result-panel { padding: 21px; }
    .feature-card h2, .result-panel h2 { margin: 0; font-size: 1.3rem; }
    .feature-card > p, .result-panel > p { color: var(--muted); font-size: .8rem; }
    .profile-rule { margin-top: 15px; padding: 13px; border-radius: 15px; background: var(--violet-soft); color: #40318a; font-size: .78rem; font-weight: 750; }
    .card-winner { margin-top: 16px; padding: 20px; border: 2px solid var(--violet); border-radius: 18px; background: #fff; }
    .card-winner small { color: var(--violet); font-weight: 850; }
    .card-winner h3 { margin: 5px 0; font-size: 1.45rem; }
    .card-winner p { margin: 8px 0 0; color: var(--muted); font-size: .78rem; }
    .rank-list { display: grid; gap: 9px; margin-top: 15px; }
    .rank { display: grid; grid-template-columns: 25px 1fr auto; gap: 9px; align-items: center; }
    .rank > span:first-child { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: .67rem; font-weight: 850; }
    .rank strong { font-size: .8rem; }
    .rank b { font-size: .76rem; color: var(--violet); }
    .warning { margin-top: 15px; padding: 12px; border-radius: 13px; background: #fffaeb; color: #7a2e0e; font-size: .72rem; }

    .ledger-form { display: grid; grid-template-columns: 1.5fr .7fr .8fr auto; gap: 9px; margin-top: 15px; }
    .ledger-form input, .ledger-form select { min-height: 43px; border: 1px solid #d8dde6; border-radius: 11px; padding: 0 10px; background: #fff; }
    .transaction-list { display: grid; gap: 1px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--line); }
    .transaction { display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; padding: 13px; background: #fff; }
    .transaction > span { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--violet); }
    .transaction p { margin: 0; display: grid; }
    .transaction small { color: var(--muted); font-size: .68rem; }
    .transaction strong:last-child { color: var(--danger); }
    .recovery { margin: 14px 0; padding: 16px; border-radius: 18px; background: #fff3f0; border: 1px solid #ffd5cc; }
    .recovery h3 { margin: 0; font-size: 1rem; }
    .recovery p { margin: 5px 0 12px; color: #8b3a2c; font-size: .77rem; }
    .recovery-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .tab-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 15px; }
    .tab-row button { min-height: 37px; padding: 0 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; cursor: pointer; font-size: .74rem; font-weight: 800; }
    .tab-row button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .allocation-bars { display: grid; gap: 13px; margin-top: 17px; }
    .allocation-line { display: grid; grid-template-columns: 100px 1fr 90px; gap: 11px; align-items: center; }
    .allocation-line span { font-size: .75rem; font-weight: 750; }
    .bar { height: 9px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: var(--violet); }
    .allocation-line strong { text-align: right; font-size: .78rem; }
    .policy-grid, .subscription-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .policy, .subscription { padding: 17px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
    .policy small, .subscription small { color: var(--muted); font-size: .68rem; }
    .policy h3, .subscription h3 { margin: 5px 0; font-size: 1rem; }
    .policy p, .subscription p { margin: 7px 0; color: var(--muted); font-size: .74rem; }
    .policy ul { padding-left: 18px; margin: 9px 0 0; font-size: .74rem; }
    .claim-box { display: grid; gap: 12px; }
    .claim-box textarea { min-height: 120px; resize: vertical; }
    .claim-result { padding: 15px; border-radius: 15px; background: #eff8ff; border: 1px solid #b2ddff; }
    .claim-result h3 { margin: 0 0 6px; font-size: .95rem; }
    .claim-result p { margin: 0; color: #1849a9; font-size: .76rem; }

    /* AI and feedback */
    .assistant-fab { position: fixed; z-index: 50; right: 22px; bottom: 22px; min-height: 50px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--violet); color: #fff; box-shadow: 0 16px 36px rgba(109,74,255,.32); cursor: pointer; font-weight: 850; display: flex; align-items: center; gap: 8px; }
    .assistant-panel { position: fixed; z-index: 60; right: 20px; bottom: 20px; width: min(390px, calc(100% - 28px)); height: min(610px, calc(100vh - 38px)); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #fff; box-shadow: 0 24px 80px rgba(17,24,39,.22); }
    .assistant-head { padding: 15px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: #fff; }
    .assistant-head > span { display: flex; align-items: center; gap: 9px; }
    .assistant-head strong { display: block; font-size: .86rem; }
    .assistant-head small { display: block; color: #aeb7c6; font-size: .63rem; margin-top: 2px; }
    .assistant-head button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
    .chat-log { padding: 15px; overflow: auto; display: flex; flex-direction: column; gap: 10px; background: #f8f9fb; }
    .bubble { max-width: 88%; padding: 11px 12px; border-radius: 15px; font-size: .78rem; white-space: pre-line; }
    .bubble.ai { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .bubble.user { align-self: flex-end; background: var(--violet); color: #fff; border-bottom-right-radius: 5px; }
    .bubble.pending { color: var(--muted); font-style: italic; }
    .assistant-form { padding: 11px; display: grid; grid-template-columns: 1fr auto; gap: 8px; border-top: 1px solid var(--line); }
    .assistant-form input { min-height: 43px; border: 1px solid #d8dde6; border-radius: 12px; padding: 0 11px; outline: none; }
    .assistant-form button { width: 43px; border: 0; border-radius: 12px; background: var(--violet); color: #fff; cursor: pointer; }
    .feedback-btn { position: fixed; z-index: 30; left: 18px; bottom: 18px; border: 1px solid var(--line); border-radius: 999px; background: #fff; min-height: 39px; padding: 0 12px; cursor: pointer; color: var(--muted); font-size: .72rem; font-weight: 750; }
    dialog { width: min(500px, calc(100% - 28px)); border: 0; border-radius: 24px; padding: 0; box-shadow: 0 30px 90px rgba(17,24,39,.28); }
    dialog::backdrop { background: rgba(17,24,39,.48); backdrop-filter: blur(4px); }
    .dialog-body { padding: 22px; }
    .dialog-head { display: flex; justify-content: space-between; gap: 10px; }
    .dialog-head h2 { margin: 0; font-size: 1.35rem; }
    .dialog-close { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: #fff; cursor: pointer; }
    .dialog-body textarea { width: 100%; min-height: 130px; margin-top: 14px; border: 1px solid #d8dde6; border-radius: 14px; padding: 12px; resize: vertical; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .toast { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 15px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .76rem; transition: .22s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {
      .header-row { grid-template-columns: 170px 1fr auto; }
      .brand-copy small, .finance-mini, .persona-chip span { display: none; }
      .main-nav { justify-content: flex-start; overflow-x: auto; }
      .mode-grid, .finance-grid, .quality-grid, .service-grid, .policy-grid, .subscription-grid { grid-template-columns: repeat(2, 1fr); }
      .money-overview { grid-template-columns: 1.1fr .9fr; }
      .goal-card { grid-column: 1 / -1; grid-template-columns: repeat(4, 1fr); }
      .goal-card button { min-height: auto; }
      .result-grid { grid-template-columns: repeat(2, 1fr); }
      .balance-stage-grid { grid-template-columns: 170px minmax(0, 1fr); }
      .donut-side { grid-column: 1 / -1; grid-template-columns: auto 210px 1fr auto; text-align: left; }
      .donut.large { width: 180px; }
    }
    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1180px); }
      .onboarding { padding: 12px 0 36px; }
      .onboarding-card { width: calc(100% - 18px); padding: 18px; border-radius: 24px; }
      .onboarding-top .primary-btn { min-height: 42px; padding: 0 14px; }
      .onboarding-heading { margin: 42px 0 22px; }
      .onboarding-heading h1 { font-size: 2.55rem; }
      .mode-grid, .finance-grid, .quality-grid, .service-grid, .result-grid, .policy-grid, .subscription-grid { grid-template-columns: 1fr; }
      .mode-card { min-height: 112px; }
      .finance-preview { grid-template-columns: 1fr; }
      .header-row { min-height: 62px; grid-template-columns: auto 1fr auto; }
      .header-row .brand-copy, .header-actions .persona-chip { display: none; }
      .brand-mark { width: 36px; height: 36px; }
      .main-nav { justify-content: flex-start; }
      .nav-btn { padding: 0 10px; font-size: .78rem; white-space: nowrap; }
      .header-actions { gap: 5px; }
      .location-btn { width: 36px; height: 36px; }
      .mega-menu { inset: 62px 0 auto; max-height: calc(100vh - 62px); overflow: auto; }
      .mega-grid { grid-template-columns: 1fr; gap: 21px; padding-block: 22px; }
      .money-overview, .two-col { grid-template-columns: 1fr; }
      .money-overview { padding: 0; }
      .balance-stage-head { align-items: flex-start; padding: 20px 17px 15px; }
      .balance-stage-head .money-actions { display: none; }
      .balance-stage-grid { grid-template-columns: 1fr; padding: 0 12px 12px; }
      .spend-rail { display: grid; grid-template-columns: 1fr 1fr; padding: 10px; }
      .spend-rail > small { grid-column: 1 / -1; }
      .spend-pill { min-height: 50px; }
      .spend-detail { min-height: 330px; padding: 22px; }
      .donut-side { grid-column: auto; grid-template-columns: 1fr; text-align: center; }
      .donut { width: 170px; }
      .settlement-tray { grid-template-columns: 1fr; margin: 0 12px 12px; }
      .zero-balance-card { margin: 0 12px 12px; align-items: stretch; flex-direction: column; }
      .qa-section { padding: 24px 18px 8px; border-radius: 28px; }
      .qa-answer { padding-right: 0; }
      .goal-card { grid-column: auto; grid-template-columns: 1fr; }
      .service-panel { padding: 17px; }
      .service-card { min-height: 230px; }
      .page-title { align-items: start; flex-direction: column; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .merchant-card { grid-template-columns: 42px 1fr; }
      .merchant-result { grid-column: 1 / -1; text-align: left; padding-left: 57px; }
      .directions { width: 100%; }
      .ledger-form { grid-template-columns: 1fr 1fr; }
      .ledger-form input:first-child { grid-column: 1 / -1; }
      .allocation-line { grid-template-columns: 86px 1fr; }
      .allocation-line strong { grid-column: 2; }
      .assistant-fab { right: 14px; bottom: 14px; }
      .feedback-btn { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

  <section id="onboarding" class="onboarding">
    <div class="onboarding-card">
      <div class="onboarding-top">
        <div class="brand" aria-label="卡搜 KASO">
          <span class="brand-mark"><svg><use href="#i-grid"/></svg></span>
          <span class="brand-copy"><strong>卡搜 KASO</strong><small>個人省錢模式</small></span>
        </div>
        <button id="completeSetup" class="primary-btn" type="button">進入 KASO <svg><use href="#i-arrow"/></svg></button>
      </div>

      <div class="onboarding-heading">
        <p class="eyebrow"><svg><use href="#i-wallet"/></svg> 第一步 · 判斷身分</p>
        <h1>先回答一題<br>再讓每一塊錢有位置。</h1>
        <p>身分只有兩種：月光族、目標計畫族。身分只改「怎麼呈現」，不改「資料從哪來」。</p>
      </div>

      <section class="setup-card" id="quizCard" aria-labelledby="quizTitle">
        <div class="setup-heading">
          <span><svg><use href="#i-target"/></svg></span>
          <div><h2 id="quizTitle">你比較符合哪一種？</h2><p id="quizSub">讀取問題中…</p></div>
        </div>
        <div id="quizOptions" class="mode-grid" aria-label="身分問答"></div>
      </section>

      <section class="setup-card" id="financeCard" hidden aria-labelledby="financeTitle">
        <div class="setup-heading">
          <span><svg><use href="#i-wallet"/></svg></span>
          <div><h2 id="financeTitle">先填幾個數字</h2><p>食衣住行育樂六類都要填，兩種身分一樣。</p></div>
        </div>
        <div class="finance-grid">
          <label class="field">目前餘額<input id="currentBalance" type="number" min="0" step="100" value="6800"></label>
          <label class="field">每月固定收入<input id="monthlyIncome" type="number" min="0" step="1000" value="30000"></label>
        </div>
        <div class="finance-grid" style="margin-top:12px">
          <label class="field">食<input id="expFood" type="number" min="0" step="100" value="400"></label>
          <label class="field">衣<input id="expClothing" type="number" min="0" step="100" value="100"></label>
          <label class="field">住<input id="expHousing" type="number" min="0" step="100" value="0"></label>
          <label class="field">行<input id="expTransport" type="number" min="0" step="100" value="200"></label>
          <label class="field">育<input id="expEducation" type="number" min="0" step="100" value="0"></label>
          <label class="field">樂<input id="expEntertainment" type="number" min="0" step="100" value="100"></label>
        </div>
        <div class="finance-grid" id="goalFields" style="margin-top:12px"></div>
        <div class="finance-preview" aria-live="polite">
          <span><small>每月先存</small><strong id="previewSave">NT$0</strong></span>
          <span><small>安心可花（估）</small><strong id="previewFlexible">NT$0</strong></span>
          <span id="previewDateWrap"><small>預計完成</small><strong id="previewDate">—</strong></span>
        </div>
      </section>
      <p class="onboarding-note"><svg><use href="#i-shield"/></svg> 資料會存到本機啟動的 KASO 後端（backend/data/store.json），不會上傳到外部服務。</p>
    </div>
  </section>

  <section id="mainApp" hidden>
    <header id="siteHeader" class="site-header">
      <div class="shell header-row">
        <button class="brand" type="button" data-view="home" aria-label="回到首頁">
          <span class="brand-mark"><svg><use href="#i-grid"/></svg></span>
          <span class="brand-copy"><strong>卡搜 <b>KASO</b></strong><small>極致省錢決策工具</small></span>
        </button>
        <nav class="main-nav" aria-label="主要功能">
          <button class="nav-btn" type="button" data-view="search" data-mega="search">商品比價</button>
          <button class="nav-btn" type="button" data-view="nearby" data-mega="nearby">附近優惠</button>
          <button class="nav-btn" type="button" data-view="ledger" data-mega="life">生活規劃</button>
        </nav>
        <div class="header-actions">
          <button id="resetProfile" class="persona-chip" type="button" title="重新設定"><svg><use href="#i-wallet"/></svg><span id="personaLabel">月光族</span></button>
          <div class="finance-mini"><span><small>保留</small><strong id="headReserve">NT$26,000</strong></span><span class="safe"><small>可花</small><strong id="headSafe">NT$4,000</strong></span></div>
          <button id="locateHeader" class="location-btn" type="button" title="定位找優惠" aria-label="定位找優惠"><svg><use href="#i-pin"/></svg></button>
        </div>
      </div>
      <div id="megaMenu" class="mega-menu" hidden></div>
    </header>

    <main class="shell main-content">
      <div id="viewRoot"></div>
    </main>

    <button id="assistantFab" class="assistant-fab" type="button"><svg><use href="#i-bot"/></svg> 問 KASO AI</button>
    <aside id="assistantPanel" class="assistant-panel" hidden aria-label="KASO AI 助手">
      <div class="assistant-head">
        <span><svg><use href="#i-bot"/></svg><span><strong>KASO AI 助手</strong><small id="assistantContext">延續目前問題 · HTML 互動稿</small></span></span>
        <button id="assistantClose" type="button" aria-label="關閉"><svg><use href="#i-x"/></svg></button>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <form id="assistantForm" class="assistant-form">
        <input id="assistantInput" autocomplete="off" placeholder="問預算、商品、卡片或保險…" aria-label="輸入問題">
        <button type="submit" aria-label="送出"><svg><use href="#i-send"/></svg></button>
      </form>
    </aside>

    <button id="feedbackOpen" class="feedback-btn" type="button">回報問題</button>
    <dialog id="feedbackDialog">
      <form method="dialog" class="dialog-body" id="feedbackForm">
        <div class="dialog-head"><div><p class="eyebrow">使用者回饋</p><h2>告訴我們哪裡需要調整</h2></div><button class="dialog-close" value="cancel" aria-label="關閉"><svg><use href="#i-x"/></svg></button></div>
        <label class="field">回報類型<select id="feedbackType"><option>功能故障</option><option>資料錯誤</option><option>功能建議</option></select></label>
        <textarea id="feedbackText" placeholder="請描述你遇到的狀況…"></textarea>
        <div class="dialog-actions"><button class="secondary-btn" value="cancel">取消</button><button id="feedbackSend" class="primary-btn" value="default">送出回報</button></div>
      </form>
    </dialog>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <script>
    "use strict";

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
    const money = (value) => new Intl.NumberFormat("zh-TW", { style: "currency", currency: "TWD", maximumFractionDigits: 0 }).format(Math.max(0, Number(value) || 0));
    const safeNumber = (id, fallback = 0) => Math.max(0, Number($(id).value) || fallback);
    const today = new Date();

    const CATEGORY_LABEL = { food: "食", clothing: "衣", housing: "住", transport: "行", education: "育", entertainment: "樂" };

    const state = {
      view: "home",
      profile: null,       // 後端回傳的完整 profile（type/income/expenses/goal/...）
      budget: null,        // 後端 calcBudget() 的結果
      quiz: [],
      resolvedType: null,  // 'moonlight' | 'goal'，來自 resolveProfile()
      searchQuery: "iPhone 15",
      searchCategory: "商品",
      searchResults: null,
      searchResultsQuery: null,
      evaluations: {},     // productId -> evaluatePurchase() 結果快取
      ledgerEntries: [],
      nearbyStores: null,
      nearbyLoading: false,
      recovery: null,
      insuranceTab: "travel",
      travelPriority: "balanced",
      budgetDetail: "safe",
      settlementDone: false,
      messages: [
        { role: "ai", text: "嗨，我是 KASO AI。你可以問我：今天還能花多少、這筆消費划不划算，或任何跟財務有關的問題。" }
      ]
    };

    async function api(path, options) {
      const res = await fetch(path, options ? { headers: { "Content-Type": "application/json" }, ...options } : undefined);
      if (!res.ok) throw new Error(`${path} → ${res.status}`);
      return res.json();
    }

    const megaContent = {
      search: [
        ["商品", ["探索所有商品", "手機、平板、電腦", "家電、遊戲、收藏卡"]],
        ["餐飲與日常", ["餐廳與咖啡", "超市與生鮮", "藥妝與日用品"]],
        ["其他比價", ["音樂與影音月費", "機票與飯店", "AI 同品項檢查"]]
      ],
      nearby: [
        ["探索附近", ["1,000 公尺內優惠", "餐廳與咖啡", "超市與藥妝"]],
        ["不用多花錢", ["文化幣去處", "免費活動", "安心預算內店家"]],
        ["為你換算", ["折扣是否在預算內", "免費活動優先", "開啟大按鈕導航"]]
      ],
      life: [
        ["每月生活", ["自動記帳", "訂閱月費", "支出與目標進度"]],
        ["旅遊", ["旅遊預算", "機票與飯店比價", "旅遊保險"]],
        ["保障", ["一般保險", "AI 理賠判斷", "保單整理"]]
      ]
    };

    // getFinance(): 把後端 calcBudget() 的結果整理成畫面要用的形狀。
    function getFinance() {
      const p = state.profile;
      const b = state.budget;
      if (!p || !b) {
        return { currentBalance: 0, fixed: 0, monthlySave: 0, spent: 0, safe: 0, reserve: 0, type: "moonlight", goal: null, expenses: {} };
      }
      return {
        currentBalance: b.currentBalance, fixed: b.fixedExpense, monthlySave: b.savingsGoal,
        spent: b.spentThisMonth, safe: b.safe, reserve: b.fixedExpense + b.savingsGoal,
        type: p.type, goal: p.goal, income: p.income, expenses: p.expenses,
      };
    }

    function futureMonth(months) {
      const d = new Date();
      d.setMonth(d.getMonth() + Number(months || 0));
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
    }

    // ---- 入口 · 二選一問答 ----
    async function loadQuiz() {
      state.quiz = await api("/api/onboarding/quiz");
      renderQuiz();
    }

    function renderQuiz() {
      const q = state.quiz[0];
      if (!q) return;
      $("#quizSub").textContent = "身分只有兩種：月光族、目標計畫族。";
      $("#quizOptions").innerHTML = q.options.map((opt, i) => `
        <button class="mode-card${state.resolvedType === (opt.value === "yes" ? "goal" : "moonlight") ? " selected featured" : ""}" type="button" data-answer="${opt.value}">
          <span class="mode-icon"><svg><use href="#i-${i === 0 ? "target" : "wallet"}"/></svg></span>
          <span><strong>${q.question}</strong><b>${opt.label}</b><small>${opt.value === "yes" ? "目標計畫族" : "月光族"}</small></span>
          <span class="mode-check">${state.resolvedType === (opt.value === "yes" ? "goal" : "moonlight") ? "✓" : "→"}</span>
        </button>`).join("");
      $$('#quizOptions [data-answer]').forEach((btn) => btn.addEventListener("click", () => handleQuizAnswer(btn.dataset.answer)));
    }

    async function handleQuizAnswer(answer) {
      const { type } = await api("/api/onboarding/resolve", { method: "POST", body: JSON.stringify({ answers: { hasGoal: answer } }) });
      state.resolvedType = type;
      renderQuiz();
      renderGoalFields();
      $("#financeCard").hidden = false;
      updateOnboardingPreview();
    }

    function renderGoalFields() {
      const wrap = $("#goalFields");
      if (state.resolvedType === "goal") {
        wrap.innerHTML = `
          <label class="field">目標名稱<input id="goalName" placeholder="例如：換筆電"></label>
          <label class="field">目標金額<input id="goalAmount" type="number" min="1" step="500" value="30000"></label>
          <label class="field">期望幾個月完成<input id="goalMonths" type="number" min="1" max="60" value="6"></label>`;
      } else {
        wrap.innerHTML = `<label class="field">每月存款目標（自己設）<input id="monthlySaveInput" type="number" min="0" step="100" value="2000"></label>`;
      }
      $$("#goalFields input").forEach((input) => input.addEventListener("input", updateOnboardingPreview));
    }

    function updateOnboardingPreview() {
      if (!state.resolvedType) return;
      const income = safeNumber("#monthlyIncome");
      const expenseIds = ["expFood", "expClothing", "expHousing", "expTransport", "expEducation", "expEntertainment"];
      const fixed = expenseIds.reduce((sum, id) => sum + safeNumber("#" + id), 0);
      const save = state.resolvedType === "goal"
        ? Math.ceil(safeNumber("#goalAmount", 1) / Math.max(1, safeNumber("#goalMonths", 1)))
        : safeNumber("#monthlySaveInput");
      $("#previewSave").textContent = money(save);
      $("#previewFlexible").textContent = money(Math.max(0, income - fixed - save));
      if (state.resolvedType === "goal") {
        $("#previewDateWrap").hidden = false;
        $("#previewDate").textContent = futureMonth(safeNumber("#goalMonths", 1));
      } else {
        $("#previewDateWrap").hidden = true;
      }
      $("#completeSetup").disabled = !income;
    }

    async function saveProfileAndEnter() {
      if (!state.resolvedType) { showToast("請先回答第一步的問題"); return; }
      const payload = {
        type: state.resolvedType,
        currentBalance: safeNumber("#currentBalance"),
        income: safeNumber("#monthlyIncome"),
        expenses: {
          food: safeNumber("#expFood"), clothing: safeNumber("#expClothing"), housing: safeNumber("#expHousing"),
          transport: safeNumber("#expTransport"), education: safeNumber("#expEducation"), entertainment: safeNumber("#expEntertainment"),
        },
      };
      if (state.resolvedType === "goal") {
        payload.goal = { name: $("#goalName").value.trim() || "存錢目標", amount: safeNumber("#goalAmount", 1), months: Math.max(1, safeNumber("#goalMonths", 1)) };
      } else {
        payload.monthlySave = safeNumber("#monthlySaveInput");
      }
      const { profile, budget } = await api("/api/profile", { method: "POST", body: JSON.stringify(payload) });
      state.profile = profile;
      state.budget = budget;
      state.settlementDone = false;
      $("#onboarding").hidden = true;
      $("#mainApp").hidden = false;
      await loadLedger();
      renderView("home");
    }

    function resetProfile() {
      state.resolvedType = null;
      $("#mainApp").hidden = true;
      $("#onboarding").hidden = false;
      $("#financeCard").hidden = true;
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function refreshBudget() {
      state.budget = await api("/api/budget");
    }

    async function loadLedger() {
      const month = new Date().toISOString().slice(0, 7);
      state.ledgerEntries = await api(`/api/ledger?month=${month}`);
    }

    function syncHeader() {
      const f = getFinance();
      $("#headReserve").textContent = money(f.reserve);
      $("#headSafe").textContent = money(f.safe);
      $("#personaLabel").textContent = f.type === "goal" ? "目標計畫族" : "月光族";
      $$(".nav-btn").forEach((btn) => {
        const group = btn.dataset.view;
        btn.classList.toggle("active", group === state.view || (group === "ledger" && ["travel", "insurance", "subscriptions"].includes(state.view)));
      });
      $("#assistantContext").textContent = `${viewLabel(state.view)} · 延續目前問題 · HTML 互動稿`;
    }

    function viewLabel(view) {
      return ({ home: "首頁", search: "商品比價", nearby: "附近優惠", ledger: "自動記帳", travel: "旅遊規劃", insurance: "保險保障", subscriptions: "訂閱比較", overseas: "海外刷卡" })[view] || "生活規劃";
    }

    function renderView(view) {
      state.view = view;
      hideMega();
      syncHeader();
      const root = $("#viewRoot");
      const renderer = ({
        home: renderHome, search: renderSearch, nearby: renderNearby,
        ledger: renderLedger, travel: renderTravel, insurance: renderInsurance,
        subscriptions: renderSubscriptions, overseas: renderOverseas
      })[view] || renderHome;
      root.innerHTML = renderer();
      bindViewEvents();
      if (view === "search") loadSearch();
      if (view === "nearby") loadNearby();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderHome() {
      const f = getFinance();
      const total = Math.max(f.reserve + f.spent + f.safe, 1);
      const reserveStop = (f.fixed / total) * 100;
      const saveStop = reserveStop + (f.monthlySave / total) * 100;
      const spentStop = Math.min(100, saveStop + (f.spent / total) * 100);
      const bg = `conic-gradient(#111827 0 ${reserveStop}%, #6d4aff ${reserveStop}% ${saveStop}%, #0878df ${saveStop}% ${spentStop}%, #b8ff3d ${spentStop}% 100%)`;
      const status = f.safe > 3000 ? ["今天有一點彈性", "可以安排小額享受，但先確認不會動到存款。"] : ["今天需要注意", "先以必要支出和低價選項為主，避免月底壓力。"];
      const carryover = Math.min(240, f.safe);
      const displayBalance = f.currentBalance + (state.settlementDone ? carryover : 0);
      const isGoal = f.type === "goal";
      const needsDelay = f.safe <= 0 && isGoal;
      return `
        <section class="view money-overview dashboard-stage">
          <div class="balance-stage-head">
            <div><p class="eyebrow">${icon("wallet")} ${isGoal ? "目標計畫族首頁" : "月光族首頁"}</p><h1>${status[0]}</h1></div>
            <div class="money-actions"><button type="button" data-view="ledger">${icon("bell")} 查看記帳</button><button type="button" data-view="nearby">${icon("pin")} 找附近優惠</button></div>
          </div>
          <div class="balance-stage-grid">
            <nav class="spend-rail" aria-label="花費分類明細">
              <small>按下分類放大檢視</small>
              ${budgetPill("fixed", "固定支出", money(f.fixed))}
              ${budgetPill("saving", "存款目標", money(f.monthlySave))}
              ${budgetPill("spent", "本月已花", money(f.spent))}
              ${budgetPill("safe", "安心可花", money(f.safe))}
            </nav>
            <section id="spendDetail" class="spend-detail" style="--detail-glow:${budgetDetailData(f, state.budgetDetail).glow}" aria-live="polite">
              <div id="spendDetailContent" class="spend-detail-content">${budgetDetailMarkup(f, state.budgetDetail)}</div>
            </section>
            <aside id="balanceDonut" class="donut-side">
              <small>目前餘額</small>
              <div class="donut large" style="background:${bg}"><span><small>目前餘額</small><strong>${money(displayBalance)}</strong></span></div>
              <div class="legend"><span><i class="legend-fixed"></i>固定</span><span><i class="legend-saving"></i>存款</span><span><i class="legend-spent"></i>已花</span><span><i class="legend-available"></i>可花</span></div>
              <span class="status-pill">${f.safe > 3000 ? "可以稍微放鬆" : "支出要收斂"}</span>
            </aside>
          </div>
          <div id="settlementTray" class="settlement-tray${state.settlementDone ? " is-done" : ""}">
            <div class="settlement-guide"><small>每日結算</small><strong>把今天沒用完的預算移回目前餘額</strong><span>按下後，金額卡片會往上移入圓餅圖。</span></div>
            <div class="settlement-pocket goal-pocket"><span><small>${isGoal ? `本月已保留 · 目標 ${money(f.goal?.amount)}` : "本月已保留 · 每月存款目標"}</small><strong id="goalSavedAmount">${money(f.monthlySave)}</strong></span><span class="status-pill">${isGoal ? `預計 ${futureMonth(f.goal?.months)}` : "沒有設目標日期"}</span></div>
            <div id="dailyPocket" class="settlement-pocket daily-pocket"><span><small>今日未用預算</small><strong id="dailyCarryoverAmount">${money(state.settlementDone ? 0 : carryover)}</strong></span><button id="settleDaily" type="button" ${state.settlementDone || carryover <= 0 ? "disabled" : ""}>${state.settlementDone ? "已移回餘額" : "今日結算"}</button></div>
          </div>
          ${needsDelay ? `<div class="zero-balance-card"><p><strong>目前可花餘額不足，建議延後完成期限</strong><small>延長一個月能降低每月存款壓力，避免再用信用額度補生活費。</small></p><button id="delayGoal" class="primary-btn" type="button">延後 1 個月</button></div>` : ""}
        </section>
        <section class="view service-panel">
          <div class="section-head"><div><h2>所有功能</h2></div></div>
          <div class="service-grid">
            ${serviceCard("search", "search", "同品項＋防詐", "商品比價", "跨平台比較價格。", [["餐飲", "search"], ["日常採買", "search"]], "商品、餐飲、日常", true)}
            ${serviceCard("pin", "nearby", "位置＋持有卡", "附近優惠", "只看附近，直接換算實付。", [["文化幣", "nearby"], ["免費活動", "nearby"]], "1,000 公尺內")}
            ${serviceCard("grid", "ledger", "帳務＋旅遊＋保障", "生活規劃", "集中管理每月生活。", [["記帳", "ledger"], ["旅遊", "travel"], ["保險", "insurance"], ["訂閱", "subscriptions"]], "生活與旅遊集中")}
          </div>
        </section>
        <section class="view qa-section" aria-labelledby="qaTitle">
          <div class="qa-title"><p class="eyebrow">${icon("grid")} KASO 使用說明</p><h2 id="qaTitle">有問？有答。</h2></div>
          <div class="qa-list">
            <details open><summary>怎麼知道今天還能花多少？</summary><div class="qa-answer"><p>系統會先保留固定支出與存款，再從目前餘額扣除已記帳金額，計算安心可花。</p><a href="#ledger" data-view="ledger">查看自動記帳</a></div></details>
            <details><summary>餘額不夠時怎麼處理？</summary><div class="qa-answer"><p>當可花餘額歸零或不足，會先建議延後目標期限，讓每月需要保留的金額下降。</p><a href="#ledger" data-view="ledger">查看支出與調整方案</a></div></details>
            <details><summary>商品比價如何確認是同一項商品？</summary><div class="qa-answer"><p>比價前會核對完整型號、容量、版本與商品狀況，資料不足時先追問。</p><a href="#search" data-view="search">前往商品比價</a></div></details>
            <details><summary>旅遊預算會包含保險嗎？</summary><div class="qa-answer"><p>旅遊頁會同時保留住宿、餐飲、交通、景點與保險入口，方便在同一個預算上限內安排。</p><a href="#insurance" data-view="insurance">查看保險保障</a></div></details>

    function budgetPill(id, label, value) {
      return `<button class="spend-pill${state.budgetDetail === id ? " active" : ""}" type="button" data-budget-detail="${id}"><span class="plus">+</span><span><strong>${label}</strong><small>${value}</small></span></button>`;
    }

    function spentByCategoryLines(totalSpent) {
      const byCat = {};
      state.ledgerEntries.forEach((e) => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
      const entries = Object.entries(byCat);
      if (!entries.length) return [["尚無記帳", 0, 0]];
      return entries.map(([cat, amt]) => [CATEGORY_LABEL[cat] || cat, totalSpent > 0 ? (amt / totalSpent) * 100 : 0, amt]);
    }

    function budgetDetailData(f, id) {
      const settledSaving = f.monthlySave;
      const details = {
        fixed: { kicker: "每月必要保留", amount: f.fixed, title: "固定支出", copy: "房租、帳單與必要支出先保留，不會出現在可花預算裡。", glow: "rgba(0,113,227,.30)", lines: [["固定帳單", 72, f.fixed * .72], ["交通通訊", 18, f.fixed * .18], ["其他必要", 10, f.fixed * .1]] },
        saving: { kicker: "存款目標進度", amount: settledSaving, title: "本月先存", copy: f.type === "goal" ? `目前目標是 ${money(f.goal?.amount)}，預計 ${futureMonth(f.goal?.months)} 完成。` : "月光族的存款目標是你自己設的每月金額，沒有設完成日期。", glow: "rgba(109,74,255,.42)", lines: [["固定存入", 100, f.monthlySave]] },
        spent: { kicker: "交易自動分類", amount: f.spent, title: "本月已記帳", copy: "點開自動記帳，可查看食衣住行育樂各分類的每一筆明細。", glow: "rgba(8,120,223,.42)", lines: spentByCategoryLines(f.spent) },
        safe: { kicker: "扣除保留後", amount: f.safe, title: "安心可花", copy: "這才是目前能使用的金額；商品與附近優惠都會以它為上限。", glow: "rgba(184,255,61,.28)", lines: [["今日可用", 64, f.safe], ["今日未用", 24, Math.min(240, f.safe)], ["彈性緩衝", 12, Math.max(0, f.safe - Math.min(240, f.safe))]] }
      };
      return details[id] || details.safe;
    }

    function budgetDetailMarkup(f, id) {
      const detail = budgetDetailData(f, id);
      return `<span class="detail-kicker">${icon(id === "saving" ? "target" : id === "spent" ? "bell" : "wallet")} ${detail.kicker}</span><div class="detail-amount">${money(detail.amount)}</div><h2 class="detail-title">${detail.title}</h2><p class="detail-copy">${detail.copy}</p><div class="detail-lines">${detail.lines.map(([label, width, amount]) => `<div class="detail-line"><span>${label}</span><i style="--line-width:${amount > 0 ? Math.max(3, width) : 0}%;--line-color:${id === "saving" ? "#a98bff" : id === "safe" ? "#b8ff3d" : "#70b7ff"}"></i><strong>${money(amount)}</strong></div>`).join("")}</div>`;
    }

    function serviceCard(iconId, view, kicker, title, detail, children, metric, primary = false) {
      return `<article class="service-card${primary ? " primary" : ""}"><div class="service-title"><span>${icon(iconId)}</span><div><small>${kicker}</small><h3>${title}</h3></div></div><button class="service-main" type="button" data-view="${view}">開啟${title} →</button><div class="service-children">${children.map(([label, child]) => `<button type="button" data-view="${child}">${label}</button>`).join("")}</div></article>`;
    }

    async function loadSearch() {
      if (state.searchResultsQuery === state.searchQuery && state.searchResults) return;
      const q = state.searchQuery;
      state.searchResults = null;
      renderSearchGridOnly();
      const results = await api(`/api/products/search?q=${encodeURIComponent(q)}`);
      if (state.searchQuery !== q) return; // 使用者已經改搜尋別的字了
      state.searchResults = results;
      state.searchResultsQuery = q;
      state.evaluations = {};
      if (state.view === "search") renderView("search");
    }

    function renderSearchGridOnly() {
      const grid = $("#searchResultGrid");
      if (grid) grid.innerHTML = `<p class="muted">搜尋中…</p>`;
    }

    function renderSearch() {
      const f = getFinance();
      const results = state.searchResults;
      const items = results?.items || null;
      return `<section class="view">
        ${pageTitle("商品比價", "資料來源：BigGo 搜尋 API，即時跨平台比價（不是假資料）。")}
        <form id="searchForm" class="toolbar"><input id="searchInput" value="${escapeHtml(state.searchQuery)}" placeholder="輸入商品名稱，例如 iPhone 15 / MacBook Air M3"><button class="primary-btn" type="submit">${icon("search")} 搜尋</button></form>
        <div class="summary-strip"><div><small>比對身分</small><strong>${f.type === "goal" ? "目標計畫族" : "月光族"}</strong></div><div><small>安心可花</small><strong>${money(f.safe)}</strong></div><div><small>找到候選</small><strong>${items ? items.length : "—"}</strong></div><div><small>資料來源</small><strong>BigGo</strong></div></div>
        <div class="result-grid" id="searchResultGrid">${!items ? `<p class="muted">搜尋中…</p>` : results.error ? `<p class="muted">BigGo 暫時連不上（${escapeHtml(results.error)}），請稍後再試。</p>` : items.length === 0 ? `<p class="muted">找不到符合的商品，換個關鍵字試試。</p>` : items.map((item) => renderProductCard(item, items)).join("")}</div>
        <p class="onboarding-note">已決議：比價用「總預算」判定，不區分食衣住行育樂分類。BigGo 回來的是跨平台候選刊登，不是同一商品的多平台比對。</p>
      </section>`;
    }

    function renderProductCard(item, allItems) {
      const f = getFinance();
      const over = !item.withinBudget;
      const evalData = state.evaluations[item.id];
      return `<article class="product-card">
        <div class="product-image">${item.image ? `<img src="${escapeAttr(item.image)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">` : icon("phone")}</div>
        <div class="product-body">
          <div class="product-meta"><span class="platform">${escapeHtml(item.platform)}</span>${item.isAd ? `<span class="match">廣告</span>` : ""}</div>
          <h3>${escapeHtml(item.title)}</h3>
          <div class="product-price">${money(item.price)}</div>
          <p class="after-buy${over ? " insufficient" : ""}">${over ? `目前不足 ${money(item.price - f.safe)}` : `買下後安心可花還剩 <strong>${money(f.safe - item.price)}</strong>`}</p>
          <div class="product-actions">
            <a href="${item.url}" target="_blank" rel="noreferrer">查看來源</a>
            ${over ? `<button type="button" data-evaluate="${escapeAttr(item.id)}" data-price="${item.price}">超出預算，怎麼辦？</button>` : ""}
          </div>
          ${evalData ? renderEvaluation(evalData, item, allItems) : ""}
        </div>
      </article>`;
    }

    function renderEvaluation(data, item, allItems) {
      const f = getFinance();
      if (data.profileType === "moonlight") {
        const affordable = allItems.filter((p) => p.id !== item.id && p.price <= f.safe).sort((a, b) => b.price - a.price).slice(0, 5);
        return `<div class="recovery">
          <h3>超出 ${money(data.overAmount)}</h3>
          ${data.monthsToAfford != null ? `<p>照目前每月存款速度，約 <strong>${data.monthsToAfford} 個月</strong>後可入手。</p>` : ""}
          ${affordable.length ? `<p>這批搜尋結果中，預算內還有：${affordable.map((a) => `${escapeHtml(a.title)}（${money(a.price)}）`).join("、")}</p>` : `<p>這批搜尋結果裡目前沒有預算內的選項。</p>`}
        </div>`;
      }
      const delay = data.options?.keepSpending?.goalDelayMonths;
      const cut = data.options?.stayOnSchedule?.cutRatio;
      return `<div class="recovery">
        <h3>超出 ${money(data.overAmount)}</h3>
        <p>維持這筆開支：目標延後約 <strong>${delay != null ? delay + " 個月" : "無法估算"}</strong>。</p>
        <p>想準時達成：六個分類各砍約 <strong>${cut != null ? Math.round(cut * 100) + "%" : "無法估算"}</strong>。</p>
      </div>`;
    }

    function loadNearby() {
      if (state.nearbyStores || state.nearbyLoading) return;
      startNearbyLookup();
    }

    function startNearbyLookup() {
      state.nearbyLoading = true;
      state.nearbyStores = null;
      const fallback = { lat: 25.0478, lng: 121.5170 };
      const proceed = async (lat, lng) => {
        try {
          state.nearbyStores = await api("/api/offers/nearby", { method: "POST", body: JSON.stringify({ lat, lng }) });
        } catch {
          state.nearbyStores = [];
        }
        state.nearbyLoading = false;
        if (state.view === "nearby") renderView("nearby");
      };
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => proceed(pos.coords.latitude, pos.coords.longitude),
          () => { showToast("無法取得定位，改用台北車站示範位置"); proceed(fallback.lat, fallback.lng); },
          { timeout: 6000 }
        );
      } else {
        proceed(fallback.lat, fallback.lng);
      }
    }

    function renderNearby() {
      const f = getFinance();
      const stores = state.nearbyStores;
      return `<section class="view">
        ${pageTitle("附近優惠", `帳戶有 ${money(f.currentBalance)}，今天只放心花 ${money(f.safe)}。`)}

      </section>`;

      const paid = store.offers.filter((o) => o.type === "paid");
      return `<article class="merchant-card">
        <span class="merchant-icon">${icon("pin")}</span>
        <div><span class="platform">${CATEGORY_LABEL[store.category] || store.category} · ${store.distance} 公尺</span><h3>${escapeHtml(store.name)}</h3>
